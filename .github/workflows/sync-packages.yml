name: Sync and Publish OpenWrt Repo

on:
  schedule:
    - cron: "0 5 * * *" # Runs daily at 05:00 UTC (after sing-box daily build)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/**'
  repository_dispatch:
    types: [sync-packages, ui-updated, core-updated]

concurrency:
  group: sync-openwrt-repo
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    name: Sync Packages & Deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync Packages & Build Indexes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
          USIGN_SECRET_KEY: ${{ secrets.USIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/sync-repo.py

      - name: Commit Updated Packages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/ keys/
          if git diff --staged --quiet; then
            echo "No package or index changes to commit."
          else
            git commit -m "chore: sync upstream releases and update repository indexes"
            # main мог уйти вперёд за время синхронизации / main may have moved during the sync
            for try in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git pull --rebase origin main
            done
            exit 1
          fi

      # Pages публикуется отсюда (Settings → Pages → Source: GitHub Actions).
      # Деплою даётся максимум 10 минут (больше deploy-pages не разрешает),
      # поэтому сайт держим маленьким: без симлинков, которые при упаковке
      # артефакта разворачиваются в полные копии каналов.
      # Pages is deployed from here (Source: GitHub Actions). deploy-pages caps
      # the timeout at 10 minutes, so keep the site small: no symlinks, since
      # they are dereferenced into full copies of the channels.
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
